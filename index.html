<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pause - Game Menu</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=MedievalSharp&family=Almendra:wght@400;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="styles/gumballStyles.css">
</head>
<body>

    <header class="container-fluid">
        <h1>PAUSED</h1>
        <p>- Progress: 92% -</p>
    </header>

    <section class="info-bar container">
        <div class="objective-item">Active Quest: Traverse the Dragons Cave</div>
        <div class="info-item">Gold: 1,450g</div>
    </section>

    <main class="pause-layout">

        <section class="medieval-card menu-container">
            <button type="button">Resume</button>
            <button type="button">Inventory</button>
            <button type="button">Settings</button>
            <button type="button">Quit</button>
        </section>

        <figure class="medieval-card image-container">
            <img src="content/art.png" alt="Hero Character Avatar Art Portfolio" />
            <section class="parchment-stats">
                <p>Health: 100% <br /> Attack: 30% <br /> Defense: 50%</p>
            </section>
        </figure>

    </main>
    <section class="controls">
        <div class="close-wrapper">
            <div class="close-box">
                <p>Select</p>
                <span class="key-cap">X</span>
            </div>
        </div>

        <div class="close-wrapper">
            <div class="close-box">
                <p>Close</p>
                <span class="key-cap">O</span>
            </div>
        </div>
    </section>

    <footer>
        <section class="copyright">
            <p>Content &amp; Imagery &copy; VAMBZ | The Day a Dragon Died</p>
        </section>

        <section class="footer-resources">
            <div class="container">
                <p>External Masteries &amp; Scrolls:</p>
                <ul>
                    <li><a href="https://www.w3schools.com/w3css/w3css_buttons.asp">Buttons</a></li>
                    <li><a href="https://egghead.io/lessons/css-animate-a-button-on-hover-with-a-css-transform">Button Animation</a></li>
                    <li><a href="https://www.youtube.com/watch?v=eZukhA4b_Ns">Changing Button Shape</a></li>
                </ul>
            </div>
        </section>
    </footer>

</body>
</html>
